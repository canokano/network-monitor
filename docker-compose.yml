services:
  postgres:
    image: postgres:18
    pull_policy: missing   # 로컬에 이미지가 없을 때만 pull, 있으면 재사용
    container_name: nm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-networkmonitor}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-networkmonitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nm-network

  redis:
    image: redis:8-alpine
    pull_policy: missing
    container_name: nm-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nm-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    pull_policy: missing
    container_name: nm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP 프로토콜 포트 (애플리케이션 연결용)
      - "15672:15672"  # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - nm-network

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:

networks:
  nm-network:
    driver: bridge