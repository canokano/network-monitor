spring:
  application:
    name: network-monitor

  # === Database ===
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop   # 개발 초기 단계 (ADR-005) — 엔티티 안정화 후 validate로 전환
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # === Redis ===
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  # === RabbitMQ ===
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  # === Security / OAuth2 Resource Server (JWT) ===
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

# === 커스텀 애플리케이션 설정 ===
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 900000      # 15분 (ms)
    refresh-token-validity: 604800000  # 7일 (ms)

# MQ 전략 패턴 스위치 (전략 패턴 빈 선택 — MqConfig.java에서 사용)
mq:
  provider: ${MQ_PROVIDER:redis}   # redis | rabbitmq

# Python FastAPI 스캐너 서버
scanner:
  base-url: ${SCANNER_BASE_URL:http://localhost:8001}

# === Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    io.github.canokano.networkmonitor: DEBUG